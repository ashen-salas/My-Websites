<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1209;
    --paper: #f7f0e3;
    --paper-dark: #ede3cc;
    --accent: #8b3a2a;
    --accent-light: #c4604a;
    --gold: #c9943a;
    --gold-light: #e8c97a;
    --muted: #7a6e5f;
    --line: #d4c8b0;
    --shadow: rgba(26,18,9,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a1f10;
    background-image:
      radial-gradient(ellipse at 20% 50%, #3d2a14 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, #1a1209 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Lora', serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* HEADER */
  header {
    width: 100%;
    max-width: 900px;
    padding: 3rem 2rem 1.5rem;
    text-align: center;
    position: relative;
  }

  .header-ornament {
    font-size: 1.2rem;
    color: var(--gold);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 0.5rem;
    font-family: 'Lora', serif;
    font-style: italic;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 400;
    color: var(--paper);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 20px rgba(201,148,58,0.3);
    line-height: 1.1;
  }

  h1 em {
    color: var(--gold-light);
    font-style: italic;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.5rem auto;
    max-width: 300px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  .divider-diamond {
    width: 8px; height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* MAIN LAYOUT */
  main {
    width: 100%;
    max-width: 900px;
    padding: 0 1.5rem 4rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  /* NEW ENTRY CARD */
  .new-entry-card {
    background: var(--paper);
    border-radius: 2px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
    overflow: hidden;
    position: relative;
  }

  .new-entry-card::before {
    content: '';
    position: absolute;
    left: 72px;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(196,96,74,0.3);
    pointer-events: none;
  }

  .card-header {
    background: var(--paper-dark);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  .card-date {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--muted);
    font-style: italic;
  }

  .card-date span {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
  }

  .mood-selector {
    display: flex;
    gap: 0.4rem;
  }

  .mood-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    color: var(--muted);
  }

  .mood-btn:hover, .mood-btn.active {
    background: var(--paper-dark);
    border-color: var(--gold);
    transform: scale(1.15);
  }

  .entry-form {
    padding: 1.5rem 2rem 1.5rem 2.5rem;
  }

  .entry-title-input {
    width: 100%;
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 0.5rem 0;
    margin-bottom: 1rem;
    outline: none;
    transition: border-color 0.3s;
  }

  .entry-title-input::placeholder { color: var(--line); font-style: italic; }
  .entry-title-input:focus { border-color: var(--gold); }

  .entry-textarea {
    width: 100%;
    min-height: 180px;
    font-family: 'Lora', serif;
    font-size: 1rem;
    line-height: 2rem;
    color: var(--ink);
    background:
      repeating-linear-gradient(
        transparent,
        transparent calc(2rem - 1px),
        var(--line) calc(2rem - 1px),
        var(--line) 2rem
      );
    border: none;
    resize: vertical;
    outline: none;
    padding: 0.1rem 0;
  }

  .entry-textarea::placeholder { color: #c5b99e; font-style: italic; }

  /* IMAGE UPLOAD */
  .image-upload-zone {
    margin-top: 1.2rem;
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 1.2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.3);
    position: relative;
  }

  .image-upload-zone:hover, .image-upload-zone.drag-over {
    border-color: var(--gold);
    background: rgba(201,148,58,0.05);
  }

  .image-upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }

  .upload-text {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
  }

  .image-previews {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 1rem;
  }

  .preview-wrapper {
    position: relative;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .preview-wrapper img {
    width: 100px; height: 100px;
    object-fit: cover;
    display: block;
  }

  .preview-remove {
    position: absolute; top: 3px; right: 3px;
    background: rgba(26,18,9,0.7);
    color: var(--paper);
    border: none; border-radius: 50%;
    width: 20px; height: 20px;
    cursor: pointer;
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }

  .preview-remove:hover { background: var(--accent); }

  /* AUDIO UPLOAD */
  .audio-upload-zone {
    margin-top: 0.75rem;
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 1rem 1.2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.3);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
  }

  .audio-upload-zone:hover, .audio-upload-zone.drag-over {
    border-color: var(--gold);
    background: rgba(201,148,58,0.05);
  }

  .audio-upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .audio-upload-icon { font-size: 1.4rem; }

  .audio-pending-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .audio-pending-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: rgba(201,148,58,0.08);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.5rem 0.8rem;
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
  }

  .audio-pending-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* CUSTOM AUDIO PLAYER */
  .audio-player {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    background: linear-gradient(135deg, #2a1f10, #1a1209);
    border-radius: 4px;
    padding: 0.8rem 1rem;
    margin-bottom: 0.4rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,0.3);
    border: 1px solid rgba(201,148,58,0.2);
  }

  .audio-player-top {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .audio-play-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--gold);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(201,148,58,0.4);
    color: #1a1209;
  }

  .audio-play-btn:hover { background: var(--gold-light); transform: scale(1.08); }

  .audio-info { flex: 1; overflow: hidden; }

  .audio-name {
    font-size: 0.82rem;
    color: var(--paper);
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.85;
  }

  .audio-time {
    font-size: 0.72rem;
    color: var(--gold);
    opacity: 0.7;
    font-family: monospace;
    margin-top: 0.1rem;
  }

  .audio-delete-btn {
    background: none;
    border: none;
    color: rgba(247,240,227,0.25);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0.2rem;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .audio-delete-btn:hover { color: #c0392b; }

  .audio-progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    margin-top: 0.2rem;
  }

  .audio-progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--gold), var(--gold-light));
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    pointer-events: none;
  }

  .entry-audios {
    padding: 0.5rem 1.5rem 0 1.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .entry-audios-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.3rem;
  }

  /* FORM ACTIONS */
  .form-actions {
    padding: 1rem 2rem 1.5rem 2.5rem;
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    border-top: 1px solid var(--line);
    background: var(--paper-dark);
  }

  .btn {
    font-family: 'Lora', serif;
    font-size: 0.9rem;
    padding: 0.6rem 1.6rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .btn-ghost:hover { border-color: var(--muted); color: var(--ink); }

  .btn-primary {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: var(--paper);
    font-style: italic;
  }

  .btn-primary:hover {
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(139,58,42,0.35);
  }

  /* ENTRIES LIST */
  .entries-section {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .entries-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.25rem;
  }

  .entries-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--paper);
    font-weight: 400;
    font-style: italic;
    opacity: 0.8;
  }

  .entries-count {
    font-size: 0.8rem;
    color: var(--gold);
    opacity: 0.7;
    letter-spacing: 0.1em;
  }

  .search-bar {
    position: relative;
    margin-bottom: 0.5rem;
  }

  .search-bar input {
    width: 100%;
    background: rgba(247,240,227,0.08);
    border: 1px solid rgba(247,240,227,0.15);
    border-radius: 2px;
    padding: 0.7rem 1rem 0.7rem 2.5rem;
    color: var(--paper);
    font-family: 'Lora', serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s;
  }

  .search-bar input::placeholder { color: rgba(247,240,227,0.3); font-style: italic; }
  .search-bar input:focus { border-color: rgba(201,148,58,0.5); }

  .search-icon {
    position: absolute;
    left: 0.8rem; top: 50%;
    transform: translateY(-50%);
    color: rgba(247,240,227,0.3);
    font-size: 0.9rem;
  }

  /* ENTRY CARD */
  .entry-card {
    background: var(--paper);
    border-radius: 2px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
    animation: fadeSlideIn 0.4s ease;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .entry-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  .entry-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--gold);
  }

  .entry-card-header {
    padding: 1.2rem 1.5rem 0.8rem 1.8rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }

  .entry-meta {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .entry-card-date {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .entry-card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }

  .entry-mood {
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .entry-card-body {
    padding: 0 1.5rem 0 1.8rem;
    font-size: 0.95rem;
    line-height: 1.8;
    color: #3d3025;
    white-space: pre-wrap;
  }

  .entry-images {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
  }

  .entry-images img {
    width: 90px; height: 90px;
    object-fit: cover;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .entry-images img:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 14px var(--shadow);
  }

  .entry-card-footer {
    padding: 0.8rem 1.5rem 1rem 1.8rem;
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }

  .btn-icon {
    background: none;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'Lora', serif;
    transition: all 0.2s;
  }

  .btn-icon:hover { color: var(--accent); border-color: var(--accent); }
  .btn-icon.delete:hover { color: #c0392b; border-color: #c0392b; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: rgba(247,240,227,0.4);
  }

  .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    animation: zoomIn 0.25s ease;
  }

  .lightbox-close {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: none; border: 1px solid rgba(255,255,255,0.3);
    color: white; font-size: 1.3rem;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .lightbox-close:hover { background: rgba(255,255,255,0.1); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--ink);
    color: var(--paper);
    padding: 0.8rem 1.4rem;
    border-radius: 2px;
    font-size: 0.9rem;
    font-style: italic;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border-left: 3px solid var(--gold);
    animation: slideToast 0.3s ease;
    z-index: 999;
  }

  /* ANIMATIONS */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes zoomIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes slideToast {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* EDIT MODE */
  .entry-card.editing .entry-card-body {
    display: none;
  }

  .edit-textarea {
    width: 100%;
    min-height: 100px;
    font-family: 'Lora', serif;
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--ink);
    background: rgba(201,148,58,0.05);
    border: 1px solid var(--gold);
    border-radius: 2px;
    padding: 0.5rem;
    resize: vertical;
    outline: none;
    margin: 0 1.5rem 0 1.8rem;
    width: calc(100% - 3.3rem);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201,148,58,0.3); border-radius: 3px; }

  @media (max-width: 600px) {
    .new-entry-card::before { left: 50px; }
    .entry-form { padding: 1.2rem 1.2rem 1.2rem 1.5rem; }
    .form-actions { padding: 1rem 1.2rem 1.2rem 1.5rem; }
    h1 { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<header>
  <p class="header-ornament">garden of ashes</p>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>
</header>

<main>
  <!-- NEW ENTRY -->
  <div class="new-entry-card">
    <div class="card-header">
      <span class="card-date">Hoy, <span id="today-date"></span></span>
    </div>

    <div class="entry-form">
      <input type="text" class="entry-title-input" id="entry-title" placeholder="titulo de la entrada" maxlength="100">
      <textarea class="entry-textarea" id="entry-body" placeholder=""></textarea>

      <div class="image-upload-zone" id="drop-zone">
        <input type="file" id="image-input" accept="image/*" multiple>
        <div class="upload-icon">🖼</div>
        <div class="upload-text">Arrastra imágenes aquí o haz clic para subir</div>
      </div>

      <div class="image-previews" id="new-previews"></div>

      <!-- AUDIO UPLOAD -->
      <div class="audio-upload-zone" id="audio-drop-zone">
        <input type="file" id="audio-input" accept="audio/mp3,audio/mpeg,audio/*" multiple>
        <span class="upload-text">Arrastra archivos MP3 aquí o haz clic para subir</span>
      </div>
      <div class="audio-pending-list" id="audio-pending-list"></div>
    </div>

    <div class="form-actions">
      <button class="btn btn-ghost" onclick="clearForm()">Limpiar</button>
      <button class="btn btn-primary" onclick="saveEntry()">Guardar entrada</button>
    </div>
  </div>

  <!-- ENTRIES LIST -->
  <div class="entries-section">
    <div class="entries-header">
      <span class="entries-title">Entradas anteriores</span>
      <span class="entries-count" id="entries-count"></span>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar en mis recuerdos…" oninput="renderEntries()">
    </div>

    <div id="entries-list"></div>
  </div>
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  // ── STATE ──────────────────────────────────────────────────────────────
  let entries = [];
  let pendingImages = []; // {dataUrl, name}
  let pendingAudios = []; // {dataUrl, name}
  let selectedMood = '';

  // ── INIT ───────────────────────────────────────────────────────────────
  function init() {
    // Date
    const now = new Date();
    document.getElementById('today-date').textContent =
      now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    // Load entries from storage
    loadEntries();
    renderEntries();
    setupDragDrop();
    setupMoodBtns();
    setupImageInput();
    setupAudioInput();
  }

  // ── STORAGE ────────────────────────────────────────────────────────────
  async function loadEntries() {
    try {
      const raw = localStorage.getItem('diary-entries');
      if (raw) entries = JSON.parse(raw);
    } catch (e) {
      entries = [];
    }
    renderEntries();
    setTimeout(initAudioMeta, 150);
  }

  function initAudioMeta() {
    entries.forEach(entry => {
      if (!entry.audios) return;
      entry.audios.forEach((_, i) => {
        const audio = document.getElementById(`audio-${entry.id}-${i}`);
        if (!audio) return;
        const timeEl = document.getElementById(`time-${entry.id}-${i}`);
        if (audio.readyState >= 1) {
          if (timeEl) timeEl.textContent = `0:00 / ${fmtTime(audio.duration)}`;
        } else {
          audio.addEventListener('loadedmetadata', () => {
            if (timeEl) timeEl.textContent = `0:00 / ${fmtTime(audio.duration)}`;
          });
        }
      });
    });
  }

  async function saveEntries() {
    try {
      localStorage.setItem('diary-entries', JSON.stringify(entries));
    } catch (e) {
      console.error('Error saving:', e);
    }
  }

  // ── MOOD ───────────────────────────────────────────────────────────────
  function setupMoodBtns() {
    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        if (selectedMood === btn.dataset.mood) {
          selectedMood = '';
        } else {
          selectedMood = btn.dataset.mood;
          btn.classList.add('active');
        }
      });
    });
  }

  // ── IMAGE INPUT ────────────────────────────────────────────────────────
  function setupImageInput() {
    const input = document.getElementById('image-input');
    input.addEventListener('change', e => handleFiles(e.target.files));
  }

  function setupDragDrop() {
    const zone = document.getElementById('drop-zone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });
  }

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImages.push({ dataUrl: e.target.result, name: file.name });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  }

  // ── AUDIO INPUT ────────────────────────────────────────────────────────
  function setupAudioInput() {
    const input = document.getElementById('audio-input');
    input.addEventListener('change', e => handleAudioFiles(e.target.files));

    const zone = document.getElementById('audio-drop-zone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      handleAudioFiles(e.dataTransfer.files);
    });
  }

  function handleAudioFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('audio/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingAudios.push({ dataUrl: e.target.result, name: file.name });
        renderAudioPending();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderAudioPending() {
    const container = document.getElementById('audio-pending-list');
    container.innerHTML = '';
    pendingAudios.forEach((audio, i) => {
      const item = document.createElement('div');
      item.className = 'audio-pending-item';
      item.innerHTML = `
        <span>🎵</span>
        <span>${escHtml(audio.name)}</span>
        <button class="preview-remove" onclick="removePendingAudio(${i})">✕</button>
      `;
      container.appendChild(item);
    });
  }

  function removePendingAudio(i) {
    pendingAudios.splice(i, 1);
    renderAudioPending();
  }

  function renderPreviews() {
    const container = document.getElementById('new-previews');
    container.innerHTML = '';
    pendingImages.forEach((img, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'preview-wrapper';
      wrapper.innerHTML = `
        <img src="${img.dataUrl}" alt="${img.name}">
        <button class="preview-remove" onclick="removePending(${i})">✕</button>
      `;
      container.appendChild(wrapper);
    });
  }

  function removePending(i) {
    pendingImages.splice(i, 1);
    renderPreviews();
  }

  // ── SAVE ENTRY ─────────────────────────────────────────────────────────
  async function saveEntry() {
    const title = document.getElementById('entry-title').value.trim();
    const body = document.getElementById('entry-body').value.trim();

    if (!title && !body && pendingImages.length === 0 && pendingAudios.length === 0) {
      showToast('Escribe algo antes de guardar ✍️');
      return;
    }

    const entry = {
      id: Date.now().toString(),
      title: title || 'Sin título',
      body,
      mood: selectedMood,
      images: pendingImages.map(i => i.dataUrl),
      audios: pendingAudios.map(a => ({ dataUrl: a.dataUrl, name: a.name })),
      date: new Date().toISOString(),
    };

    entries.unshift(entry);
    await saveEntries();
    clearForm();
    renderEntries();
    showToast('Entrada guardada 📖');
    // Init audio metadata for new entries
    setTimeout(initAudioMeta, 100);
  }

  function clearForm() {
    document.getElementById('entry-title').value = '';
    document.getElementById('entry-body').value = '';
    document.getElementById('new-previews').innerHTML = '';
    document.getElementById('image-input').value = '';
    document.getElementById('audio-input').value = '';
    document.getElementById('audio-pending-list').innerHTML = '';
    pendingImages = [];
    pendingAudios = [];
    selectedMood = '';
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  }

  // ── RENDER ENTRIES ─────────────────────────────────────────────────────
  function renderEntries() {
    const list = document.getElementById('entries-list');
    const count = document.getElementById('entries-count');
    const query = (document.getElementById('search-input')?.value || '').toLowerCase();

    const filtered = entries.filter(e =>
      !query ||
      e.title.toLowerCase().includes(query) ||
      e.body.toLowerCase().includes(query)
    );

    count.textContent = filtered.length
      ? `${filtered.length} ${filtered.length === 1 ? 'entrada' : 'entradas'}`
      : '';

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📔</div>
          <div class="empty-text">${query ? 'No se encontraron entradas' : 'Aún no hay entradas. Escribe tu primer recuerdo…'}</div>
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(entry => {
      const date = new Date(entry.date);
      const dateStr = date.toLocaleDateString('es-MX', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      const imagesHtml = entry.images && entry.images.length > 0
        ? `<div class="entry-images">${entry.images.map((src, i) =>
            `<img src="${src}" alt="foto ${i+1}" onclick="openLightbox('${entry.id}', ${i})">`
          ).join('')}</div>`
        : '';

      const audiosHtml = entry.audios && entry.audios.length > 0
        ? `<div class="entry-audios">
            <div class="entry-audios-label">🎵 Audio</div>
            ${entry.audios.map((audio, i) => `
              <div class="audio-player" id="player-${entry.id}-${i}">
                <div class="audio-player-top">
                  <button class="audio-play-btn" onclick="togglePlay('${entry.id}', ${i})">▶</button>
                  <div class="audio-info">
                    <div class="audio-name">${escHtml(audio.name)}</div>
                    <div class="audio-time" id="time-${entry.id}-${i}">0:00 / 0:00</div>
                  </div>
                  <button class="audio-delete-btn" onclick="deleteAudio('${entry.id}', ${i})" title="Eliminar audio">✕</button>
                </div>
                <div class="audio-progress-bar" id="bar-${entry.id}-${i}" onclick="seekAudio(event, '${entry.id}', ${i})">
                  <div class="audio-progress-fill" id="fill-${entry.id}-${i}"></div>
                </div>
                <audio id="audio-${entry.id}-${i}" src="${audio.dataUrl}" preload="metadata"></audio>
              </div>
            `).join('')}
            </div>`
        : '';

      return `
        <div class="entry-card" id="card-${entry.id}">
          <div class="entry-card-header">
            <div class="entry-meta">
              <span class="entry-card-date">${dateStr}</span>
              <span class="entry-card-title">${escHtml(entry.title)}</span>
            </div>
            ${entry.mood ? `<span class="entry-mood">${entry.mood}</span>` : ''}
          </div>
          <div class="entry-card-body">${escHtml(entry.body)}</div>
          ${imagesHtml}
          ${audiosHtml}
          <div class="entry-card-footer">
            <button class="btn-icon" onclick="editEntry('${entry.id}')">✏ Editar</button>
            <button class="btn-icon delete" onclick="deleteEntry('${entry.id}')">✕ Eliminar</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // ── EDIT ───────────────────────────────────────────────────────────────
  function editEntry(id) {
    const entry = entries.find(e => e.id === id);
    if (!entry) return;

    const card = document.getElementById(`card-${id}`);
    const bodyEl = card.querySelector('.entry-card-body');
    const footer = card.querySelector('.entry-card-footer');

    if (card.classList.contains('editing')) return;
    card.classList.add('editing');

    const ta = document.createElement('textarea');
    ta.className = 'edit-textarea';
    ta.value = entry.body;
    bodyEl.parentNode.insertBefore(ta, bodyEl.nextSibling);

    footer.innerHTML = `
      <button class="btn-icon" onclick="cancelEdit('${id}')">Cancelar</button>
      <button class="btn-icon" style="color:var(--accent);border-color:var(--accent)" onclick="saveEdit('${id}')">Guardar</button>
    `;
  }

  function cancelEdit(id) {
    const card = document.getElementById(`card-${id}`);
    card.classList.remove('editing');
    renderEntries();
  }

  async function saveEdit(id) {
    const card = document.getElementById(`card-${id}`);
    const ta = card.querySelector('.edit-textarea');
    const entry = entries.find(e => e.id === id);
    if (entry && ta) {
      entry.body = ta.value;
      await saveEntries();
    }
    renderEntries();
    showToast('Entrada actualizada ✔');
  }

  // ── DELETE ─────────────────────────────────────────────────────────────
  async function deleteEntry(id) {
    if (!confirm('¿Eliminar esta entrada permanentemente?')) return;
    entries = entries.filter(e => e.id !== id);
    await saveEntries();
    renderEntries();
    showToast('Entrada eliminada');
  }

  // ── LIGHTBOX ───────────────────────────────────────────────────────────
  function openLightbox(entryId, imgIdx) {
    const entry = entries.find(e => e.id === entryId);
    if (!entry) return;
    document.getElementById('lightbox-img').src = entry.images[imgIdx];
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  // ── TOAST ──────────────────────────────────────────────────────────────
  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // ── AUDIO PLAYER ───────────────────────────────────────────────────────
  let currentAudio = null;
  let currentPlayBtn = null;

  function togglePlay(entryId, idx) {
    const audio = document.getElementById(`audio-${entryId}-${idx}`);
    const btn = document.querySelector(`#player-${entryId}-${idx} .audio-play-btn`);
    if (!audio) return;

    // Stop previous
    if (currentAudio && currentAudio !== audio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      if (currentPlayBtn) currentPlayBtn.textContent = '▶';
      updateFill(currentAudio, 0);
    }

    if (audio.paused) {
      audio.play();
      btn.textContent = '⏸';
      currentAudio = audio;
      currentPlayBtn = btn;
      setupAudioEvents(audio, entryId, idx);
    } else {
      audio.pause();
      btn.textContent = '▶';
    }
  }

  function setupAudioEvents(audio, entryId, idx) {
    audio.ontimeupdate = () => {
      const fill = document.getElementById(`fill-${entryId}-${idx}`);
      const timeEl = document.getElementById(`time-${entryId}-${idx}`);
      if (!fill || !timeEl) return;
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      fill.style.width = pct + '%';
      timeEl.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration || 0)}`;
    };
    audio.onended = () => {
      const btn = document.querySelector(`#player-${entryId}-${idx} .audio-play-btn`);
      if (btn) btn.textContent = '▶';
      const fill = document.getElementById(`fill-${entryId}-${idx}`);
      if (fill) fill.style.width = '0%';
    };
    audio.onloadedmetadata = () => {
      const timeEl = document.getElementById(`time-${entryId}-${idx}`);
      if (timeEl) timeEl.textContent = `0:00 / ${fmtTime(audio.duration)}`;
    };
  }

  function seekAudio(e, entryId, idx) {
    const audio = document.getElementById(`audio-${entryId}-${idx}`);
    const bar = document.getElementById(`bar-${entryId}-${idx}`);
    if (!audio || !bar || !audio.duration) return;
    const rect = bar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
  }

  function updateFill(audio, pct) {
    // generic fallback
  }

  async function deleteAudio(entryId, idx) {
    const entry = entries.find(e => e.id === entryId);
    if (!entry || !entry.audios) return;
    // Stop if playing
    const audio = document.getElementById(`audio-${entryId}-${idx}`);
    if (audio) { audio.pause(); audio.src = ''; }
    entry.audios.splice(idx, 1);
    await saveEntries();
    renderEntries();
    showToast('Audio eliminado');
  }

  function fmtTime(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  // ── UTILS ──────────────────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  init();
</script>
</body>
</html>
